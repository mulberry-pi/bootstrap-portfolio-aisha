<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="./style.css" rel="stylesheet" />
</head>

<body class="page-shell">
    <header class="px-5 p-3 text-white bg-dark">
        <div>
            <h3 class="float-md-start text-center">mulberry.pi</h3>
            <nav class="nav nav-masthead justify-content-center float-md-end">
                <a class="nav-link fw-bold py-1 px-0" href="index.html">Home</a>
                <a class="nav-link fw-bold py-1 px-0" href="projects.html">Projects</a>
                <a class="nav-link fw-bold py-1 px-0 active" aria-current="page" href="#contact">Contact</a>
            </nav>
        </div>
    </header>

    <main class="container py-5 page-main contact-main">
        <div class="contact-heading">
            <p class="contact-eyebrow">GET IN TOUCH</p>
            <h1>Let's Connect!</h1>
            <p>Have a project in mind or want to talk through an idea? Send me a message.</p>
        </div>
        <form class="contact-form" action="submit_application.php" method="POST">
            <div class="mb-3">
                <label class="form-label" for="name">Name</label>
                <input class="form-control" type="text" id="name" name="name" placeholder="Jane Doe" autocomplete="name" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="email">Email address</label>
                <input class="form-control" type="email" id="email" name="email" placeholder="jane@example.com" autocomplete="email" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="subject">Reason for contacting</label>
                <select class="form-select" id="subject" name="subject" required>
                    <option value="" selected disabled>Select a reason</option>
                    <option value="consultation">Consultation</option>
                    <option value="recruitment">Job recruitment</option>
                    <option value="service">Service request</option>
                    <option value="general">General inquiry</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label" for="message">Message</label>
                <textarea class="form-control" id="message" name="message" rows="5" placeholder="Tell me a little about what you have in mind..." required></textarea>
            </div>

            <button class="btn btn-dark contact-submit" type="submit">
                Send message <i class="bi bi-arrow-up-right ms-2" aria-hidden="true"></i>
            </button>
        </form>
    </main>

    <!-- Page footer -->
            <footer class="site-footer px-5 py-3">

                    </nav>
                </div>
      </footer>
    
</body>
</html>
